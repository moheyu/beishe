server:
  port: 8080
  servlet:   # 整个请求的最大大小
    context-path: /api


spring:
  web:
    resources:
      static-locations: classpath:/static/, file:D:/bishe/uploads/
  servlet:
    multipart:
      max-file-size: 10MB        # 单个文件最大大小（可根据需求调整）
      max-request-size: 20MB
  application:
    name: travel-recommendation
  profiles:
    active: dev

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wit.travel.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: wit-travel-recommendation-secret-key-2024
  expiration: 86400000

file:
  upload:
    path: D:\bishe\uploads
    domain: http://localhost:8080/api
