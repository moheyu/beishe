version: '3.8'

services:
  # 数据库服务
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: travel_recommendation
      MYSQL_USER: travel
      MYSQL_PASSWORD: travel123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init_scenic_category.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - travel-network

  # Redis 服务
  redis:
    image: redis:6.2
    container_name: travel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    networks:
      - travel-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/travel_recommendation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - SPRING_DATASOURCE_USERNAME=travel
      - SPRING_DATASOURCE_PASSWORD=travel123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    volumes:
      - ./uploads:/opt/travel/uploads
    depends_on:
      - mysql
      - redis
    restart: always
    networks:
      - travel-network

  # 前端服务
  frontend:
    build:
      context: ./frontend/bishe
      dockerfile: Dockerfile
    container_name: travel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - travel-network

volumes:
  mysql-data:
  redis-data:

networks:
  travel-network:
    driver: bridge